<h1>Analysis Log</h1>

<p>The analysis log window (invoked through the menu <a href="analysis_menu.htm">Analysis</a>, 
option Analysis log) shows the logs of all <a href="../../calculate/calculating_in_geomec.htm"> analysis</a> runs performed.&nbsp; 
The analysis log data can be exported to another package and can be cleared to 
remove all log data.</p>
