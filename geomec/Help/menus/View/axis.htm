<h1><span style="mso-ansi-language:EN-GB">Axis<o:p>
</o:p>
</span></h1>
<p class="MsoNormal"><span style="mso-ansi-language:EN-GB">The Axis command
toggles the model axis (</span>X, Y &amp; Depth arrows<span style="mso-ansi-language:EN-GB">) on and off. <o:p>
</o:p>
</span><span style="mso-ansi-language:EN-GB">&nbsp;<o:p>
</o:p>
</span></p>
<p class="MsoNormal"><span style="mso-ansi-language:EN-GB">This command can be
executed by:<o:p>
</o:p>
</span></p>
<ul style="margin-top:0cm" type="disc">
  <li class="MsoNormal" style="mso-list:l8 level1 lfo54;tab-stops:list 36.0pt"><span style="mso-ansi-language:EN-GB">Clicking
    the axis button in the <a href="../../toolbars/Toolbar_View.htm">Toolbar View</a>.<o:p>
    </o:p></span></li>
  <li class="MsoNormal" style="mso-list:l8 level1 lfo54;tab-stops:list 36.0pt">
	<span style="mso-ansi-language:EN-GB">(De)Selecting
    axis
    in the <a href="View_Menu.htm">View Menu</a><o:p>
    .</o:p>
    </span></li>
</ul>
<p class="MsoNormal"><span style="mso-ansi-language:EN-GB">&nbsp;<o:p>
</o:p>
</span></p>
