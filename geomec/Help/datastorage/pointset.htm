<h1>Pointset</h1>

<p>A pointset is a set of coordinates with or without associated data. For 3D 
computation, a <a href="2d_pointset.htm">2D pointset </a>is a combination of 
Northing, Easting and data values. A <a href="3d_pointset.htm">3D pointset </a>
contains a combination of Northing, Easting, Depth and data values:</p>
