<h1><span style="mso-ansi-language:EN-GB">Lighting<o:p>
</o:p>
</span></h1>
<p class="MsoNormal"><span style="mso-ansi-language:EN-GB">The Lighting button
of the <a href="toolbar_view.htm"> Toolbar View</a> toggles the lighting on and off. It provides a
shaded view of the model using parallel light for illumination.<o:p>
</o:p>
</span></p>
<p class="MsoNormal">If a value is displayed (<span style="mso-ansi-language:EN-GB"><a href="../menus/view/Value.htm">Value</a>
in the View Menu is activated) the lighting will be switched off.</span></p>

<p class="MsoNormal"><span style="mso-ansi-language:EN-GB"><o:p>
</o:p>
</span></p>
