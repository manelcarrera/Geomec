</span></h1>
<p class="MsoNormal"><span style="mso-ansi-language:EN-GB">In GEOMEC the default
iterative method is <a href="newton_regular.htm"> Regular Newton-Raphson</a> with a maximum of 5 iteration per

<a href="force_norm.htm"> force norm</a>
with a ratio of 0.001.<o:p></o:p>
