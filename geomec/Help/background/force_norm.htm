<h1><span style="mso-ansi-language:EN-GB">Force Norm<o:p>
</o:p>
</span></h1>
<p class="MsoNormal"><span style="mso-ansi-language:EN-GB">The force norm is the
Euclidian norm of the out-of-balance force vector g.<span style="mso-spacerun:
yes">&nbsp;</span>To check convergence, the force norm after the current
iteration is checked against the norm of the initial unbalance g0:<o:p>
</o:p>
</span></p>
