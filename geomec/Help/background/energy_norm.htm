<h1><span style="mso-ansi-language:EN-GB">Energy norm<o:p>
</o:p>
</span></h1>
<p class="MsoNormal"><span style="mso-ansi-language: EN-GB">One</span><span style="mso-ansi-language:EN-GB">
way to check
convergence is the energy norm. This norm is composed of internal forces and
relative displacements. To determine convergence, the energy ratio is calculated
as<o:p>
&nbsp;
</span></p>
<table border="0" width="100%">
  <tr>
    <td width="17%"><span lang="NL">Energy norm ratio =</span><span style="mso-ansi-language:EN-GB"><font size="3"><span lang="EN-US" style="mso-bidi-font-size: 12.0pt; mso-ansi-language: EN-GB">
      </span><span lang="EN-US" style="mso-text-raise: -15.0pt; mso-ansi-language: EN-GB"><!--[if gte vml 1]><v:shapetype id="_x0000_t75"
 coordsize="21600,21600" o:spt="75" o:preferrelative="t" path="m@4@5l@4@11@9@11@9@5xe"
 filled="f" stroked="f">
 <v:stroke joinstyle="miter"/>
 <v:formulas>
  <v:f eqn="if lineDrawn pixelLineWidth 0"/>
  <v:f eqn="sum @0 1 0"/>
  <v:f eqn="sum 0 0 @1"/>
  <v:f eqn="prod @2 1 2"/>
  <v:f eqn="prod @3 21600 pixelWidth"/>
  <v:f eqn="prod @3 21600 pixelHeight"/>
  <v:f eqn="sum @0 0 1"/>
  <v:f eqn="prod @6 1 2"/>
  <v:f eqn="prod @7 21600 pixelWidth"/>
  <v:f eqn="sum @8 21600 0"/>
  <v:f eqn="prod @7 21600 pixelHeight"/>
  <v:f eqn="sum @10 21600 0"/>
 </v:formulas>
 <v:path o:extrusionok="f" gradientshapeok="t" o:connecttype="rect"/>
 <o:lock v:ext="edit" aspectratio="t"/>
</v:shapetype><v:shape id="_x0000_i1025" type="#_x0000_t75" style='width:48.75pt;
 height:39.75pt'>
 <v:imagedata src="file:///C:/DOCUME~1/fnc/LOCALS~1/Temp/msoclip1/02/clip_image001.wmz"
  o:title=""/>
</v:shape><![endif]-->
      </span><span lang="EN-US" style="mso-bidi-font-size: 12.0pt; mso-ansi-language: EN-GB"><o:p>
      </o:p>
      </span><o:p>
      </font></span></td>
    <td width="83%"><span lang="EN-US" style="font-size:10.0pt;font-family:
&quot;Times New Roman&quot;;mso-fareast-font-family:&quot;Times New Roman&quot;;mso-text-raise:
-17.0pt;mso-ansi-language:EN-US;mso-fareast-language:EN-US;mso-bidi-language:
AR-SA"><!--[if gte vml 1]><v:shapetype id="_x0000_t75" coordsize="21600,21600"
 o:spt="75" o:preferrelative="t" path="m@4@5l@4@11@9@11@9@5xe" filled="f"
 stroked="f">
 <v:stroke joinstyle="miter"/>
 <v:formulas>
  <v:f eqn="if lineDrawn pixelLineWidth 0"/>
  <v:f eqn="sum @0 1 0"/>
  <v:f eqn="sum 0 0 @1"/>
  <v:f eqn="prod @2 1 2"/>
  <v:f eqn="prod @3 21600 pixelWidth"/>
  <v:f eqn="prod @3 21600 pixelHeight"/>
  <v:f eqn="sum @0 0 1"/>
  <v:f eqn="prod @6 1 2"/>
  <v:f eqn="prod @7 21600 pixelWidth"/>
  <v:f eqn="sum @8 21600 0"/>
  <v:f eqn="prod @7 21600 pixelHeight"/>
  <v:f eqn="sum @10 21600 0"/>
 </v:formulas>
 <v:path o:extrusionok="f" gradientshapeok="t" o:connecttype="rect"/>
