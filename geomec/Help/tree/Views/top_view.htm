<h1>Top view</h1>

<p>The top view looks down at the model. It is not possible to rotate the model
in top view. Panning (CTRL + mouse) and zooming (SHIFT + mouse) is possible.</p>
<p>The top view is automatically selected when <a href="../Model/list_wellpaths_tree.htm">wellpaths</a>,
<a href="../Model/list_cross_sections_tree.htm"> cross-sections</a> or <a href="../Model/list_of_meshregions_tree.htm"> mesh
regions</a> are going to be inserted graphically.</p>
