<h1>Default</h1>

<p>The default view is used when no other view is selected or applicable. In
default view, single or equal geological entities can be viewed in their color,
or with a mapped result.</p>
<p>Rotating, panning and zooming can be performed <a href="../../main%20window/dynamic.htm">dynamically</a>.</p>
