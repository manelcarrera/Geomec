<h1>Delete Cross section</h1>
<p class="MsoNormal">A <a href="../tree/Model/list_cross_sections_tree.htm"> cross section</a> can be deleted by right-clicking on the
cross section in the <a href="../tree/Model/model_tree.htm"> model tree</a> and selecting delete.</p>
<p class="MsoNormal"><span style="mso-ansi-language:EN-GB">Use <a href="file:///F:/tnma/Develop/GEOMEC3/Help/context/insert_cross_section.htm">insert
cross section</a> to create a new cross section.</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-GB">Use <a href="change_position_cross_section.htm">change
position</a> to change the position of an existing cross section</span><span style="mso-ansi-language:EN-GB"><o:p></o:p>.
</span></p>
