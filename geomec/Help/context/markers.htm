<h1><span style="mso-ansi-language:EN-GB">Markers</span></h1>

<p class="MsoNormal"><span lang="EN-US" style="mso-ansi-language:EN-US">Markers
is used to </span><span style="mso-ansi-language:EN-GB">show or hide the Markers
in the result line in the <a href="../tree/Views/2D_line_graph.htm">2D-Line
graph</a>. <o:p>
</o:p>
</span></p>
<p class="MsoNormal"><span style="mso-ansi-language:EN-GB">This option can
be toggled on and off by right-clicking on the 2D-Line graph and selecting Markers.<o:p>
</o:p>
</span></p>

<p>&nbsp;</p>
