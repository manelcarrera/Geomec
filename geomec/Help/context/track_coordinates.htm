<h1><span style="mso-ansi-language:EN-GB">Track coordinates</span></h1>

<p class="MsoNormal"><span style="mso-ansi-language:EN-GB">Track coordinates is
used to show or hide the coordinates (<a href="true_vertical_depth.htm">TVD</a> or
<a href="along_vertical_depth.htm">AHD</a>, result) when moving the mouse
pointer along the plotted result line in the <a href="../tree/Views/2D_line_graph.htm">2D-Line
graph view</a>.<o:p>
</o:p></span></p>

<p class="MsoNormal"><span style="mso-ansi-language:EN-GB">This option can
be toggled on and off by right-clicking on the 2D-Line graph and selecting Track
coordinates.<o:p>
</o:p>
</span></p>

<p>&nbsp;</p>
