<h1>Delete Wellpath</h1>
<p>A <a href="../tree/Model/list_wellpaths_tree.htm"> wellpath</a> can be deleted by right-clicking on the wellpath in the
<a href="../tree/Model/model_tree.htm"> model tree</a>
and selecting delete.</p>
<p><span style="mso-ansi-language: EN-GB">Use <a href="insert_vertical_wellpath.htm">insert
vertical wellpath</a> to create a new vertical wellpath.</span></p>
<p><span style="mso-ansi-language: EN-GB">Use <a href="insert_deviated_wellpath.htm">insert
deviated wellpath</a> to insert a deviated wellpath.</span></p>
<p>&nbsp;</p>
<p>&nbsp;</p>
